[package]
name = "s3-pdfjs"
version = "0.1.0"
edition = "2021"
description = "Spike S3: PDF.js en WebView2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
debug = false
